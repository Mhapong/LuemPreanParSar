[project]
name = "luem"
version = "0.1.0"
description = "Detect and fix text typed in the wrong keyboard layout (Thai Kedmanee <-> US QWERTY) on Linux"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Add as each phase starts (see IMPLEMENTATION_PLAN.md)
data = ["datasets", "pythainlp"]
ml = ["numpy", "torch", "onnx", "onnxruntime", "matplotlib"]
demo = ["evdev", "onnxruntime", "numpy"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules src tests"
