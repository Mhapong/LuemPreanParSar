[project]
name = "luem"
version = "0.1.0"
description = "Detect and fix text typed in the wrong keyboard layout (Thai Kedmanee <-> US QWERTY) on Linux"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Add as each phase starts (see docs/IMPLEMENTATION_PLAN.md)
data = ["datasets", "pythainlp"]
ml = ["numpy", "torch", "onnx", "onnxruntime", "matplotlib"]
demo = ["evdev; sys_platform == 'linux'", "onnxruntime", "numpy"]

[dependency-groups]
dev = ["pytest"]

# torch from PyPI is CPU-only on Windows: take the CUDA build there (training PC, RTX 3070),
# and the small CPU build on the Linux notebook (dev + latency measurement)
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules src tests"
